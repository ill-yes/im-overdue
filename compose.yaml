services:
  im-overdue:
    image: ghcr.io/ill-yes/im-overdue:latest
    build: .
    ports:
      - "${IM_OVERDUE_PORT:-4317}:4317"
    environment:
      IM_OVERDUE_ORIGIN: ${IM_OVERDUE_ORIGIN:?Set the canonical app URL in .env}
      IM_OVERDUE_PASSWORD: ${IM_OVERDUE_PASSWORD:?Set a private password in .env}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - ./appdata:/data
    restart: unless-stopped
    stop_grace_period: 20s
